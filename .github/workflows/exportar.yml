# Exportación puntual de solo lectura de los picks (borrar después).
name: Exportar
on: workflow_dispatch
permissions:
  contents: read
jobs:
  exportar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: bash scripts/r2.sh pull
      - run: python3 scripts/export_picks.py data/tipster.sqlite
