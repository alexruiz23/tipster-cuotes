[project]
name = "tipster-cuotes"
version = "0.1.0"
description = "Tipster de fútbol que solo recomienda apuestas: nunca las coloca."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "scipy>=1.18.1",
    "typer>=0.27.3",
]

[project.scripts]
tipster = "tipster.cli.app:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tipster"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]  # los bloques de código de docs/ son pseudocódigo de diseño

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = [
    "PLR0913", # firmas con muchos argumentos con nombre son deliberadas (inyección de dependencias)
    "PLR2004", # los tests usan valores literales calculados a mano
    "RUF001",  # el texto en español usa caracteres como «» y ·
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["tipster"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
